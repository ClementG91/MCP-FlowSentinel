name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev
      - name: Verify module files are tidy
        run: go mod tidy -diff
      - name: Run vet
        run: go vet ./...
      - name: Run tests with race detector
        run: go test -race -shuffle=on ./...
      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # ── Linux amd64 ──────────────────────────────────────────────────────────────
  build-linux-amd64:
    name: Build linux/amd64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/mcp-flowsentinel-linux-amd64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-amd64
          path: dist/

  # ── Linux arm64 (native GitHub ARM runner) ───────────────────────────────────
  build-linux-arm64:
    name: Build linux/arm64
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/mcp-flowsentinel-linux-arm64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-arm64
          path: dist/

  # ── macOS Intel ──────────────────────────────────────────────────────────────
  build-darwin-amd64:
    name: Build darwin/amd64
    needs: verify
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install libpcap
        run: brew install libpcap
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/mcp-flowsentinel-darwin-amd64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-darwin-amd64
          path: dist/

  # ── macOS Apple Silicon (macos-latest = ARM runner) ──────────────────────────
  build-darwin-arm64:
    name: Build darwin/arm64
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install libpcap
        run: brew install libpcap
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/mcp-flowsentinel-darwin-arm64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-darwin-arm64
          path: dist/

  # ── Windows amd64 (cross-compiled from Ubuntu with mingw-w64 + Npcap SDK) ────
  # We cross-compile rather than use a Windows runner to keep build times low
  # and avoid the Npcap driver installation requirement at compile time.
  build-windows-amd64:
    name: Build windows/amd64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install cross-compile toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y mingw-w64 unzip
      - name: Download Npcap SDK
        run: |
          curl -fsSL https://npcap.com/dist/npcap-sdk-1.13.zip -o npcap-sdk.zip
          echo "dad1f2bf1b02b787be08ca4862f99e39a876c1f274bac4ac0cedc9bbc58f94fd  npcap-sdk.zip" | sha256sum -c -
          unzip -q npcap-sdk.zip -d npcap-sdk
      - name: Build
        env:
          CGO_CFLAGS: "-I${{ github.workspace }}/npcap-sdk/Include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/npcap-sdk/Lib/x64 -lws2_32 -lsetupapi"
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/mcp-flowsentinel-windows-amd64.exe .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-windows-amd64
          path: dist/

  # ── Assemble release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-darwin-amd64
      - build-darwin-arm64
      - build-windows-amd64
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum -- mcp-flowsentinel-* sbom.spdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ### Windows (no Go required)
            ```powershell
            irm https://raw.githubusercontent.com/ClementG91/MCP-FlowSentinel/main/install.ps1 | iex
            ```
            > **Prerequisite — Npcap:** download from [npcap.com/#download](https://npcap.com/#download) and install with *"WinPcap API-compatible Mode"* checked.

            ### Linux / macOS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/ClementG91/MCP-FlowSentinel/main/install.sh | bash
            ```

            ## Self-update
            ```
            mcp-flowsentinel --update
            ```

            ## Verify
            ```
            mcp-flowsentinel --check
            ```

            See [README](https://github.com/ClementG91/MCP-FlowSentinel#readme) for full documentation and MCP client configuration.
