name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build + Test ─────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: true

      # ── Platform libpcap setup ─────────────────────────────────────────────
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Install libpcap (macOS)
        if: runner.os == 'macOS'
        run: brew install libpcap

      # The Npcap SDK provides wpcap.lib for CGO linkage at compile time.
      # The Npcap *driver* is not available on GitHub Windows runners, so any
      # test that would call pcap.OpenLive() is excluded on Windows.
      - name: Download Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          $expected = "dad1f2bf1b02b787be08ca4862f99e39a876c1f274bac4ac0cedc9bbc58f94fd"
          $actual = (Get-FileHash npcap-sdk.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Npcap SDK SHA-256 mismatch: $actual" }
          Expand-Archive npcap-sdk.zip -DestinationPath C:\npcap-sdk
          Add-Content $env:GITHUB_ENV "CGO_CFLAGS=-IC:\npcap-sdk\Include"
          Add-Content $env:GITHUB_ENV "CGO_LDFLAGS=-LC:\npcap-sdk\Lib\x64"

      - name: Download dependencies
        run: go mod download

      - name: Validate Windows PowerShell 5.1 scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @('build-windows.ps1', 'install.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed' }

      - name: Verify module files are tidy
        run: go mod tidy -diff

      # ── go vet (all platforms) ─────────────────────────────────────────────
      - name: go vet
        run: go vet ./...

      # ── Full build (all platforms) ─────────────────────────────────────────
      - name: Build
        run: go build ./...

      # ── Tests + race detector (Linux / macOS) ─────────────────────────────
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      # ── Tests (Windows) ────────────────────────────────────────────────────
      # Offline PCAP/PCAPNG tests use the pure-Go reader and do not require the
      # Npcap runtime. Live-capture entry points are not invoked by unit tests.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -shuffle=on ./...

      # ── Coverage gate: fail if total < 70 % (Linux only) ──────────────────
      - name: Enforce coverage ≥ 70%
        if: runner.os == 'Linux'
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${TOTAL}%"
          python3 -c "import sys; cov=float('${TOTAL}'); sys.exit(0 if cov>=70 else 1)" \
            || (echo "::error::Coverage ${TOTAL}% is below the 70% minimum" && exit 1)

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  # ── Formatting + static analysis ─────────────────────────────────────────────
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Validate shell scripts
        run: bash -n build-linux.sh build-macos.sh install.sh setup.sh
      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Run gosec
        # Exclusions cover required Windows syscall usage, best-effort cleanup,
        # executable permissions, and operator-selected local file paths.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -exclude='G103,G104,G302,G304,G703' ./...
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # ── govulncheck — known CVEs in Go dependencies ───────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
