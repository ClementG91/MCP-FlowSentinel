name: Bug report
description: Report a reproducible defect in MCP-FlowSentinel.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MCP-FlowSentinel. For security vulnerabilities, use private vulnerability reporting from the Security tab instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `mcp-flowsentinel --version` or the commit SHA.
      placeholder: v0.2.0 or 0123456
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, webhook URLs, personal data, and unrelated packet contents.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not disclose a security vulnerability publicly.
          required: true
